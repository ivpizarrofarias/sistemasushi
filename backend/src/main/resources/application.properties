spring.application.name=backend

# Perfil de conexión: local (localhost) o server (<IP_DEL_SERVIDOR>).
# Para decidir cuál usar:
#   - Variable de entorno: APP_PROFILE=local|server
#   - Argumento Maven:    ./mvnw spring-boot:run -Dspring-boot.run.profiles=local
#   - Argumento Java:     --spring.profiles.active=local
spring.profiles.default=${APP_PROFILE:server}

# --- Servidor ---
server.port=${SERVER_PORT:8080}
server.address=${SERVER_ADDRESS:0.0.0.0}
server.servlet.session.timeout=2h
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# --- PostgreSQL (sobrescribible por perfil o variables de entorno) ---
# Variables de entorno: DB_URL, DB_USER, DB_PASSWORD
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=America/Santiago

# --- Jackson ---
spring.jackson.time-zone=America/Santiago

# --- CORS (frontend de desarrollo) ---
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# --- Negocio ---
app.business.name=${BUSINESS_NAME:Sushi Local}
app.currency=${CURRENCY:CLP}
