name: sistemasushi

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: sistemasushi-app:latest
    container_name: sistemasushi-app
    restart: unless-stopped
    network_mode: host
    environment:
      # Perfil activo: server (conecta a la base de datos del servidor)
      SPRING_PROFILES_ACTIVE: server
      # Conexión a PostgreSQL (definida en .env, que no se versiona)
      DB_URL: ${DB_URL:?define DB_URL en .env}
      DB_USER: ${DB_USER:?define DB_USER en .env}
      DB_PASSWORD: ${DB_PASSWORD:?define DB_PASSWORD en .env}
      # Usuarios iniciales opcionales (solo si la tabla de usuarios está vacía)
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_CASHIER_USERNAME: ${SEED_CASHIER_USERNAME:-}
      SEED_CASHIER_PASSWORD: ${SEED_CASHIER_PASSWORD:-}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      SERVER_PORT: ${APP_PORT:-8000}
